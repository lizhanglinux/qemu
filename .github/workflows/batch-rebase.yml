name: Batch Rebase All Branches onto master

on:
  workflow_dispatch:

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history and branches

      - name: Configure git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: List all branches except master
        id: branches
        run: |
          BRANCHES=$(git for-each-ref --format='%(refname:short)' refs/heads/ | grep -v '^master$' | xargs)
          echo "branches=$BRANCHES" >> $GITHUB_OUTPUT

      - name: Rebase each branch onto master
        if: steps.branches.outputs.branches != ''
        run: |
          for branch in ${{ steps.branches.outputs.branches }}; do
            echo "Processing branch: $branch"
            git checkout $branch
            git rebase master || { echo "Rebase failed for $branch, skipping..."; git rebase --abort; continue; }
            git push --force-with-lease origin $branch
          done